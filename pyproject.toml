[project]
name = "message-flagger"
version = "0.1.0"
description = "Chat mínimo que usa un mmBERT ajustado para flaggear agresiones y clasificar el sentimiento de cada mensaje"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "torch>=2.14",
    "transformers>=5.18",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]
# Training and evaluation data and metrics (trainer/, bench/): Hugging Face datasets and scikit-learn.
bench = [
    "datasets>=4.0",
    "scikit-learn>=1.9",
]

[tool.uv]
package = false
default-groups = ["dev", "bench"]

# PyPI only ships CPU builds of torch for Windows, so torch comes from the PyTorch CUDA index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: loads real models or downloads datasets; run with `pytest -m slow`"]
